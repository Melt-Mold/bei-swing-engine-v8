[flake8]
max-line-length = 120
extend-ignore = E203, W503, E501, E701, E702, F401, F841, E731, E741, E402, F541, E231, E128, E127, F811, F821, W291
exclude = 
    .git,
    __pycache__,
    venv,
    .venv,
    build,
    dist,
    .pytest_cache,
    output_test
per-file-ignores =
    # Tests don't need docstrings
    tests/*:D100,D101,D102,D103
    # CLI modules can have longer functions
    bei_swing_engine_v8/cli.py:C901
